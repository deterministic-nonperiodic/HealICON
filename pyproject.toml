[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["healicon*"]

[project]
name = "healicon"
version = "0.1.0"
description = "HealICON: A command-line tool designed for wave and tidal analysis in global atmospheric simulations. Uses HEALPix as the base grid for interpolation, providing an equal-area environment optimized for mapping tidal harmonics and gravity wave spectra across the globe."
authors = [{ name = "Yanmichel A. Morfa", email = "morfa@iap-kborn.de" }]
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "xarray",
    "dask",
    "netCDF4",
    "healpy",
    "numpy",
    "scipy",
    "pyyaml",
    "click",
    "pint",
]

[project.optional-dependencies]
gpu = ["cupy", "cuml"] # Assumes RAPIDS cuml for GPU KDTree, cupy for GPU arrays.
test = ["pytest", "matplotlib"]

[project.scripts]
healicon = "healicon.cli:cli"
